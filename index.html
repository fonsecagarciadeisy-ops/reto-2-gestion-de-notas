<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Notas de Certámenes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="contenedor">
        <!-- Formulario: Vista según imagen 1 -->
        <div class="tarjeta">
            <form id="form-alumno">
                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required autocomplete="off">
                </div>

                <div class="campo">
                    <label for="certamen1">Certamen 1:</label>
                    <input type="number" id="certamen1" min="1" max="100" step="any" required>
                </div>

                <div class="campo">
                    <label for="certamen2">Certamen 2:</label>
                    <input type="number" id="certamen2" min="1" max="100" step="any" required>
                </div>

                <div class="campo">
                    <label for="certamen3">Certamen 3:</label>
                    <input type="number" id="certamen3" min="1" max="100" step="any" required>
                </div>

                <button type="submit" id="btn-agregar">Agregar Alumno</button>
            </form>
        </div>

        <!-- Resultados: Vista según imagen 2 -->
        <div id="seccion-resultados" class="tarjeta tarjeta-resultados" style="display: none;"></div>
    </main>

    <script src="interfaz.js"></script>
</body>
</html>
